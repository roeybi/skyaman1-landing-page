name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        env:
          PORT: 3000
          BASE_PATH: /skyaman1-landing-page/
        run: pnpm --filter @workspace/sky-aman-1 run build

      - name: Create SPA route files
        run: |
          INDEX=artifacts/sky-aman-1/dist/public/index.html
          cp "$INDEX" artifacts/sky-aman-1/dist/public/404.html
          mkdir -p artifacts/sky-aman-1/dist/public/thank-you
          cp "$INDEX" artifacts/sky-aman-1/dist/public/thank-you/index.html
          mkdir -p artifacts/sky-aman-1/dist/public/privacy
          cp "$INDEX" artifacts/sky-aman-1/dist/public/privacy/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/sky-aman-1/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
